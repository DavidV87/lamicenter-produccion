# =============================================================
# Lamicenter — Configuración Nginx
# Destino en el servidor: /etc/nginx/conf.d/lamicenter.conf
# Plataforma: CentOS / Rocky Linux / AlmaLinux
#
# PASOS DE ACTIVACIÓN
#   1. Copiar este archivo al servidor:
#      scp scripts/despliegue/nginx/lamicenter.conf \
#          usuario@SERVIDOR:/etc/nginx/conf.d/lamicenter.conf
#   2. Ajustar las líneas marcadas con [AJUSTAR]
#   3. Validar sintaxis:  sudo nginx -t
#   4. Aplicar cambios:   sudo systemctl reload nginx
#
# Referencia: docs/despliegue-linux.md § 6 — Nginx
# =============================================================

server {
    listen      80;
    listen      [::]:80;

    # [AJUSTAR] Reemplazar _ por la IP o hostname real del servidor en la LAN/VPN
    # Ejemplos:
    #   server_name 192.168.1.100;
    #   server_name lamicenter.lan;
    #   server_name 10.8.0.1;          <- IP típica de servidor VPN (OpenVPN/WireGuard)
    # El comodín _ acepta cualquier Host header; útil en prueba inicial
    server_name _;

    # Ocultar versión de Nginx en cabeceras de respuesta y páginas de error
    server_tokens off;

    # ── Límite de cuerpo de solicitud ────────────────────────────
    # Necesario para la carga de PDFs (facturas, planos CutList).
    # Aumentar a 50M si los archivos de planos superan este tamaño.
    # El límite predeterminado de Nginx es 1M, insuficiente para documentos.
    client_max_body_size 20M;

    # ── Frontend estático (React + Vite SPA) ─────────────────────
    # [AJUSTAR] Ruta absoluta al dist/ del frontend en el servidor
    # Se genera con: npm run build   (en el directorio frontend/)
    root  /opt/lamicenter/frontend/dist;
    index index.html;

    # Ruta raíz — SPA con React Router
    # try_files intenta:
    #   1. $uri         → archivo físico exacto (p. ej. /favicon.ico)
    #   2. $uri/        → directorio con index (poco usual en SPA)
    #   3. /index.html  → fallback: React Router maneja la ruta en el cliente
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Assets estáticos — caché de larga duración ───────────────
    # Vite genera nombres con hash de contenido (ej. index-Cg1ZptWC.js)
    # por lo que "immutable" es seguro: el nombre cambia con cada build
    # y el navegador no necesita revalidar mientras el hash sea el mismo.
    #
    # NOTA Nginx: esta location define su propio add_header, por lo que
    # las cabeceras de seguridad del bloque server no se heredan aquí.
    # Para un entorno LAN/VPN interno esto es aceptable.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        # Omitir entradas de acceso para recursos estáticos (reduce ruido en logs)
        access_log off;
    }

    # ── API — proxy inverso al backend NestJS (PM2 / puerto 3000) ─
    #
    # El prefijo global de NestJS es "api/v1", por lo que todas las rutas
    # tienen la forma /api/v1/...  (pedidos, catalogo, produccion, etc.)
    #
    # proxy_pass SIN barra final: Nginx pasa la URI sin modificar al backend.
    #   Cliente  → Nginx:   GET /api/v1/pedidos
    #   Nginx    → Backend: GET /api/v1/pedidos   ← correcto
    # Con barra final (/): stripearía "/api" del prefijo y rompería el routing.
    #
    location /api/ {
        proxy_pass          http://127.0.0.1:3000;

        # HTTP/1.1 requerido para keep-alive y soporte de WebSocket futuro
        proxy_http_version  1.1;

        # Limpiar la cabecera Connection para evitar que cabeceras hop-by-hop
        # del cliente lleguen al backend (buena práctica para proxies HTTP/1.1)
        # Si en el futuro se necesita WebSocket, cambiar a: "upgrade"
        proxy_set_header    Connection         "";

        # Identidad del cliente real — necesario para logs de auditoría del backend
        proxy_set_header    Host               $host;
        proxy_set_header    X-Real-IP          $remote_addr;
        proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto  $scheme;

        # Timeouts
        # connect: tiempo máximo para establecer conexión con el backend
        # read:    tiempo máximo esperando respuesta — aumentar si el parser
        #          de PDFs o procesos batch tardan más de 60 s
        # send:    tiempo máximo enviando la solicitud al backend
        proxy_connect_timeout  10s;
        proxy_read_timeout     60s;
        proxy_send_timeout     60s;

        # Propagar el límite de body al bloque de proxy
        # (hereda del server block, declarado explícitamente para claridad)
        client_max_body_size   20M;
    }

    # ── Cabeceras de seguridad HTTP ───────────────────────────────
    # "always" asegura que se incluyan también en respuestas de error (4xx, 5xx)
    #
    # NOTA Nginx: estas cabeceras aplican a las locations que NO definen
    # su propio add_header (/ y /api/). La location de assets estáticos
    # las sobreescribe con Cache-Control (ver comentario en esa location).
    add_header X-Frame-Options         "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options  "nosniff"                       always;
    add_header X-XSS-Protection        "1; mode=block"                 always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── Compresión gzip ───────────────────────────────────────────
    # Reduce el tamaño de respuestas JSON de la API y del HTML/CSS/JS.
    # Útil incluso en LAN cuando las respuestas de reportes son grandes.
    gzip              on;
    gzip_comp_level   4;          # equilibrio CPU / ratio de compresión
    gzip_min_length   1024;       # no comprimir respuestas muy pequeñas
    gzip_proxied      any;        # comprimir también respuestas proxiadas
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        text/xml
        application/xml
        image/svg+xml;
    gzip_vary         on;         # añade Vary: Accept-Encoding al response

    # ── Logs ─────────────────────────────────────────────────────
    # [AJUSTAR] Verificar que /var/log/nginx/ tiene permisos para el usuario nginx
    #   sudo mkdir -p /var/log/nginx
    #   sudo chown nginx:nginx /var/log/nginx
    access_log  /var/log/nginx/lamicenter-access.log;
    error_log   /var/log/nginx/lamicenter-error.log  warn;
}
